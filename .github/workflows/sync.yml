name: Sync LeetCode Progress

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Configure Git
        run: |
          git config user.name "Sakshi-Void"
          git config user.email "211979199+Sakshi-Void@users.noreply.github.com"

      - name: Run sync script
        run: python sync_leetcode.py
